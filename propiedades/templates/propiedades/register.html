{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TocaCasa - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --accent: #00d2ff; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: white;
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            border: 1px solid #e2e8f0;
            max-width: 440px;
            width: 100%;
        }
        .register-card .form-control {
            border-radius: 16px;
            padding: 12px 18px;
            border: 2px solid #e2e8f0;
            font-size: 0.95rem;
        }
        .register-card .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,210,255,0.15);
        }
        .btn-accent {
            background: var(--primary);
            color: white;
            border-radius: 16px;
            padding: 12px;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-accent:hover {
            background: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(15,23,42,0.3);
        }
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-user-plus text-info fa-3x mb-3"></i>
            <h3 class="fw-bold">Crear Cuenta</h3>
            <p class="text-muted">Regístrate para consultar propiedades</p>
        </div>

        {% if error %}
        <div class="error-msg mb-3"><i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="fw-semibold mb-1 small">Nombre completo</label>
                <input type="text" name="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
            </div>
            <div class="mb-3">
                <label class="fw-semibold mb-1 small">Email</label>
                <input type="email" name="email" class="form-control" placeholder="tu@email.com" required>
            </div>
            <div class="mb-3">
                <label class="fw-semibold mb-1 small">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="mb-4">
                <label class="fw-semibold mb-1 small">Confirmar contraseña</label>
                <input type="password" name="password_confirm" class="form-control" placeholder="Repite la contraseña" required minlength="6">
            </div>
            <button type="submit" class="btn btn-accent w-100 mb-3">CREAR CUENTA</button>
        </form>

        <p class="text-center text-muted small mb-0">
            ¿Ya tienes cuenta? <a href="{% url 'login' %}" class="fw-bold text-dark">Inicia sesión</a>
        </p>
        <p class="text-center mt-2">
            <a href="{% url 'index' %}" class="text-muted small"><i class="fa-solid fa-arrow-left me-1"></i>Volver al inicio</a>
        </p>
    </div>
</body>
</html>
